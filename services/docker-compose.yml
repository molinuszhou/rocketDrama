name: joyedrama-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dramaflow_rewards}
      POSTGRES_USER: ${POSTGRES_USER:-dramaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rewards_postgres_data:/var/lib/postgresql/data
      - ./rewards/sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./rewards/sql/002_monetization_v3.sql:/docker-entrypoint-initdb.d/002_monetization_v3.sql:ro
      - ./rewards/sql/003_rewards_v4.sql:/docker-entrypoint-initdb.d/003_rewards_v4.sql:ro
      - ./rewards/sql/004_ad_flow_v5.sql:/docker-entrypoint-initdb.d/004_ad_flow_v5.sql:ro
      - ./rewards/sql/005_random_chest_and_reward_v6.sql:/docker-entrypoint-initdb.d/005_random_chest_and_reward_v6.sql:ro
      - ./rewards/sql/006_rewarded_actions_and_player_v7.sql:/docker-entrypoint-initdb.d/006_rewarded_actions_and_player_v7.sql:ro
      - ./rewards/sql/007_v8_player_reward_polish.sql:/docker-entrypoint-initdb.d/007_v8_player_reward_polish.sql:ro
      - ./rewards/sql/008_v81_ad_fatigue_and_crown_curve.sql:/docker-entrypoint-initdb.d/008_v81_ad_fatigue_and_crown_curve.sql:ro
      - ./rewards/sql/009_v162_reward_control.sql:/docker-entrypoint-initdb.d/009_v162_reward_control.sql:ro
      - ./rewards/sql/010_v163_localized_wallet_and_rewards.sql:/docker-entrypoint-initdb.d/010_v163_localized_wallet_and_rewards.sql:ro
      - ./rewards/sql/011_v163_round_gem_values.sql:/docker-entrypoint-initdb.d/011_v163_round_gem_values.sql:ro
      - ./rewards/sql/012_v163_round_gem_values_v2.sql:/docker-entrypoint-initdb.d/012_v163_round_gem_values_v2.sql:ro
      - ./rewards/sql/013_v163_damping_thresholds_v3.sql:/docker-entrypoint-initdb.d/013_v163_damping_thresholds_v3.sql:ro
      - ./rewards/sql/014_market_wallet_policy_management.sql:/docker-entrypoint-initdb.d/014_market_wallet_policy_management.sql:ro
      - ./rewards/sql/015_app_review_reward.sql:/docker-entrypoint-initdb.d/015_app_review_reward.sql:ro
      - ./rewards/sql/016_crown_road_effective_rounds.sql:/docker-entrypoint-initdb.d/016_crown_road_effective_rounds.sql:ro
      - ./rewards/sql/017_v1635_checkin_200k_five_tier_damping.sql:/docker-entrypoint-initdb.d/017_v1635_checkin_200k_five_tier_damping.sql:ro
      - ./rewards/sql/018_low_frequency_ad_policy.sql:/docker-entrypoint-initdb.d/018_low_frequency_ad_policy.sql:ro
      - ./rewards/sql/019_direct_cash_wallet_tasks_and_ad_cooldowns.sql:/docker-entrypoint-initdb.d/019_direct_cash_wallet_tasks_and_ad_cooldowns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rewards-api:
    build:
      context: ./rewards
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dramaflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dramaflow_rewards}
      HOST: 0.0.0.0
      PORT: 8100
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://10.0.2.2}
      ALLOW_DEBUG_AD_PROOF: ${ALLOW_DEBUG_AD_PROOF:-true}
      PANGLE_CALLBACK_SECRET: ${PANGLE_CALLBACK_SECRET:-}
      ADMIN_DASHBOARD_TOKEN: ${ADMIN_DASHBOARD_TOKEN:-}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${REWARDS_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

  content-api:
    build:
      context: ./content
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CONTENT_CORS_ORIGINS:-http://localhost,http://10.0.2.2}
      PANGLE_CONTENT_ENABLED: "false"
      FREE_DRAMA_DATABASE_URL: ${FREE_DRAMA_DATABASE_URL:-}
      FREE_DRAMA_CDN_BASE_URL: ${FREE_DRAMA_CDN_BASE_URL:-}
      PLAYBACK_SIGNING_KEY: ${PLAYBACK_SIGNING_KEY:?Set PLAYBACK_SIGNING_KEY in .env}
      OWNED_CATALOG_PATH: /app/content/owned_catalog.json
      LOCAL_MEDIA_ENABLED: ${LOCAL_MEDIA_ENABLED:-true}
      LOCAL_MEDIA_ROOT: /app/media
    volumes:
      - type: bind
        source: ${OWNED_CATALOG_PATH:-./content/content/owned_catalog.three-test-dramas.json}
        target: /app/content/owned_catalog.json
        read_only: true
      - type: bind
        source: ${LOCAL_MEDIA_ROOT:-./content/media}
        target: /app/media
        read_only: true
    ports:
      - "${CONTENT_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rewards_postgres_data:
