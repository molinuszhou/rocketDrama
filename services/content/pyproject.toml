[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dramaflow-content-server"
version = "0.1.2"
description = "Unified content orchestration server for FreeDrama and Pangle Drama"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3.0"
]

[tool.setuptools.packages.find]
# 仅打包服务代码；content、media、runtime 和 tests 是运行时资源/测试资源，不能参与自动包发现。
include = ["app"]
exclude = ["content*", "media*", "runtime*", "tests*"]
namespaces = false

[tool.uvicorn]
factory = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
