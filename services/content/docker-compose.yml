services:
  content-api:
    build:
      context: .
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: http://10.0.2.2:8000,http://localhost:3000
      PANGLE_CONTENT_ENABLED: "false"
      # 以下变量在接入真实自有剧视频服务后填写；不要提交真实密钥。
      FREE_DRAMA_DATABASE_URL: ${FREE_DRAMA_DATABASE_URL:-}
      FREE_DRAMA_CDN_BASE_URL: ${FREE_DRAMA_CDN_BASE_URL:-}
      PLAYBACK_SIGNING_KEY: ${PLAYBACK_SIGNING_KEY:-replace-before-production}
      # 例如 /app/content/owned_catalog.json；为空则加载内置演示目录。
      OWNED_CATALOG_PATH: ${OWNED_CATALOG_PATH:-}
      # 仅本地开发和局域网真机联调时启用；生产环境必须保持 false。
      LOCAL_MEDIA_ENABLED: ${LOCAL_MEDIA_ENABLED:-false}
      LOCAL_MEDIA_ROOT: /app/media
      # 动态奖励规则和权益账本必须持久化；ADMIN_CONFIG_TOKEN 仅保留在宿主环境变量或未提交 .env 文件中。
      REWARD_RULES_PATH: /app/runtime/reward_rules.json
      REWARD_LEDGER_PATH: /app/runtime/reward_ledger.sqlite3
      ADMIN_CONFIG_TOKEN: ${ADMIN_CONFIG_TOKEN:-}
    volumes:
      - ./content:/app/content:ro
      - ./media:/app/media:ro
      - ./runtime:/app/runtime
    ports:
      - "8000:8000"
    restart: unless-stopped
