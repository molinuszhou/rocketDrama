# 将本片段粘贴到 www.joyelleasia.com 现有 HTTPS server { ... } 块内部。
# 不要放在 nginx.conf 顶层的 http { ... } 块中。
#
# ^~ 使该路径优先于现有的 location ~^/(api|images|h5) 正则规则。
# proxy_pass 末尾的 / 会去掉外部 /joyedrama-rewards/ 前缀，
# 因此 FastAPI 实际接收到 /health、/v2/...、/admin 等原始路径。

location = /joyedrama-rewards {
    return 308 /joyedrama-rewards/;
}

location ^~ /joyedrama-rewards/ {
    proxy_pass http://127.0.0.1:18100/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /joyedrama-rewards;

    # Rewards API 只处理小型 JSON 请求，不继承现有媒体接口的超长超时和大缓冲区。
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_redirect off;
}
