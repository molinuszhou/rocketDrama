# Paste this INSIDE the existing `server { ... }` block for www.joyelleasia.com.
# It must not be placed directly in nginx.conf's `http { ... }` scope.
#
# The ^~ prefix prevents the existing regex location ~^/(api|images|h5)
# from taking this request. The trailing slash in proxy_pass strips the
# external /joyedrama-rewards/ prefix before FastAPI receives the request.

location = /joyedrama-rewards {
    return 308 /joyedrama-rewards/;
}

location ^~ /joyedrama-rewards/ {
    proxy_pass http://127.0.0.1:18100/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /joyedrama-rewards;

    # Reward API payloads are small JSON. Do not inherit the existing media/API
    # location's very long read timeout or large file buffers.
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_redirect off;
}
