# 正式环境：宿主机原生 Nginx 负责公网 HTTPS；本编排绝不占用 80、443。
# Rewards API 仅绑定到 127.0.0.1，由 Nginx 反向代理。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-joyedrama_rewards}
      POSTGRES_USER: ${POSTGRES_USER:-joyedrama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
    volumes:
      - rewards_postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rewards-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-joyedrama}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-joyedrama_rewards}
      HOST: 0.0.0.0
      PORT: 8100
      ENVIRONMENT: production
      # 填现有站点的来源，不要包含 /joyedrama-rewards 路径。
      CORS_ORIGINS: ${CORS_ORIGINS:?请设置现有 HTTPS 站点来源}
      ALLOW_DEBUG_AD_PROOF: "false"
      # 仅服务端保存，禁止写入 Android 或 BuildConfig。
      PANGLE_CALLBACK_SECRET: ${PANGLE_CALLBACK_SECRET:?请设置广告服务端回调验签密钥}
      ADMIN_DASHBOARD_TOKEN: ${ADMIN_DASHBOARD_TOKEN:?请设置高强度后台管理令牌}
      TIMEZONE: ${TIMEZONE:-UTC}
    # 仅供宿主机原生 Nginx 访问；不要改成 0.0.0.0。
    ports:
      - "127.0.0.1:${REWARDS_BIND_PORT:-18100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  rewards_postgres_data:
