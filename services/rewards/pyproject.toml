[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dramaflow-rewards-service"
version = "0.1.0"
description = "Independent PostgreSQL gems, rewards and ad-settlement service for DramaFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "geoip2>=5.0,<6.0",
  "cryptography>=43.0,<45.0"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0"
]

[tool.setuptools.packages.find]
include = ["app"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
