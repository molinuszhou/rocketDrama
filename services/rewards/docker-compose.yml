services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dramaflow_rewards}
      POSTGRES_USER: ${POSTGRES_USER:-dramaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rewards_postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_monetization_v3.sql:/docker-entrypoint-initdb.d/002_monetization_v3.sql:ro
      - ./sql/003_rewards_v4.sql:/docker-entrypoint-initdb.d/003_rewards_v4.sql:ro
      - ./sql/004_ad_flow_v5.sql:/docker-entrypoint-initdb.d/004_ad_flow_v5.sql:ro
      - ./sql/005_random_chest_and_reward_v6.sql:/docker-entrypoint-initdb.d/005_random_chest_and_reward_v6.sql:ro
      - ./sql/006_rewarded_actions_and_player_v7.sql:/docker-entrypoint-initdb.d/006_rewarded_actions_and_player_v7.sql:ro
      - ./sql/007_v8_player_reward_polish.sql:/docker-entrypoint-initdb.d/007_v8_player_reward_polish.sql:ro
      - ./sql/008_v81_ad_fatigue_and_crown_curve.sql:/docker-entrypoint-initdb.d/008_v81_ad_fatigue_and_crown_curve.sql:ro
      - ./sql/009_v162_reward_control.sql:/docker-entrypoint-initdb.d/009_v162_reward_control.sql:ro
      - ./sql/010_v163_localized_wallet_and_rewards.sql:/docker-entrypoint-initdb.d/010_v163_localized_wallet_and_rewards.sql:ro
      - ./sql/011_v163_round_gem_values.sql:/docker-entrypoint-initdb.d/011_v163_round_gem_values.sql:ro
      - ./sql/012_v163_round_gem_values_v2.sql:/docker-entrypoint-initdb.d/012_v163_round_gem_values_v2.sql:ro
      - ./sql/013_v163_damping_thresholds_v3.sql:/docker-entrypoint-initdb.d/013_v163_damping_thresholds_v3.sql:ro
      - ./sql/014_market_wallet_policy_management.sql:/docker-entrypoint-initdb.d/014_market_wallet_policy_management.sql:ro
      - ./sql/015_app_review_reward.sql:/docker-entrypoint-initdb.d/015_app_review_reward.sql:ro
      - ./sql/016_crown_road_effective_rounds.sql:/docker-entrypoint-initdb.d/016_crown_road_effective_rounds.sql:ro
      - ./sql/017_v1635_checkin_200k_five_tier_damping.sql:/docker-entrypoint-initdb.d/017_v1635_checkin_200k_five_tier_damping.sql:ro
      - ./sql/018_low_frequency_ad_policy.sql:/docker-entrypoint-initdb.d/018_low_frequency_ad_policy.sql:ro
      - ./sql/019_direct_cash_wallet_tasks_and_ad_cooldowns.sql:/docker-entrypoint-initdb.d/019_direct_cash_wallet_tasks_and_ad_cooldowns.sql:ro
      - ./sql/020_v1647_random_task_redpackets.sql:/docker-entrypoint-initdb.d/020_v1647_random_task_redpackets.sql:ro
      - ./sql/021_v1648_six_tier_damping.sql:/docker-entrypoint-initdb.d/021_v1648_six_tier_damping.sql:ro
      - ./sql/022_v1649_interstitial_schedule_and_usd_default.sql:/docker-entrypoint-initdb.d/022_v1649_interstitial_schedule_and_usd_default.sql:ro
      - ./sql/023_v1650_episode_reward_claim_prompt_threshold.sql:/docker-entrypoint-initdb.d/023_v1650_episode_reward_claim_prompt_threshold.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  rewards-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dramaflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dramaflow_rewards}
      HOST: 0.0.0.0
      PORT: 8100
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ALLOW_DEBUG_AD_PROOF: ${ALLOW_DEBUG_AD_PROOF:-true}
      PANGLE_CALLBACK_SECRET: ${PANGLE_CALLBACK_SECRET:-}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
    ports:
      - "${REWARDS_PORT:-8100}:8100"

volumes:
  rewards_postgres_data:
